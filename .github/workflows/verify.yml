name: Verify portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        helm: [v3.19.0, v4.3.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ matrix.helm }}
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/check.sh
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/docker-smoke.sh
      - run: bash scripts/dnstt-smoke.sh
      - name: Check DNSTT binary without network access
        run: |
          docker run --rm --network none --entrypoint sh ggvpn-portfolio-dnstt:1.0.0 \
            -ec 'dnstt-server -gen-key -privkey-file /tmp/server.key -pubkey-file /tmp/server.pub >/dev/null; test -s /tmp/server.pub'
      - name: Scan public files for secrets
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact=100 --no-banner
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        helm: [v3.19.0, v4.3.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ matrix.helm }}
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: portfolio-ci
          wait: 120s
      - run: KUBE_CONTEXT=kind-portfolio-ci bash scripts/integration.sh
