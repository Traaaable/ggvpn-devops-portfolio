services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ggvpn-portfolio-web:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_HTTP_PORT:-18080}:8080"
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1770
    cpus: 0.2
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
