apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ggvpn-web.fullname" . }}-test"
  labels:
    {{- include "ggvpn-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    # Helm 3 reads --logs after the hook completes; retain the Pod until next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 60
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http-check
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          base="http://{{ include "ggvpn-web.fullname" . }}:{{ .Values.service.port }}"
          test "$(wget -qO- "$base/healthz")" = ok
          wget -qO /tmp/page "$base/"
          test "$(sha256sum /tmp/page | cut -d ' ' -f 1)" = "{{ .Values.pageContent | sha256sum }}"
          wget -qO /dev/null "$base/readyz"
          # Only the page, never the Nginx config, belongs to the document root.
          if wget -qO /dev/null "$base/nginx.conf"; then exit 1; fi
          echo "Health, readiness and exact page content: PASS"
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 1Mi
