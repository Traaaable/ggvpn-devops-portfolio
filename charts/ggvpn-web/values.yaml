replicaCount: 2
nameOverride: ""
fullnameOverride: ""

image:
  repository: nginx
  tag: "1.30.6-alpine-slim"
  # Multi-platform image index. An explicit tag remains useful for humans.
  digest: sha256:3028fc1419f99b95c1c69f844bbaf49dc1b881750c51b497fc721ac4f02a14e6
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: portfolio.example.test
      paths:
        - path: /
          pathType: Prefix
  # Supply an existing TLS Secret in the release namespace.
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx

nodeSelector: {}
tolerations: []
affinity: {}

pageContent: |
  <!doctype html>
  <html lang="en"><head><meta charset="utf-8"><title>GG VPN DevOps lab</title></head>
  <body><h1>GG VPN DevOps lab</h1><p>Release v1 — Helm, Docker and Kubernetes.</p></body></html>
